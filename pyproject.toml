[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hapticstream"
version = "0.1.0"
description = "Windows XInput vibration driver for HapticStream"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7", "PyAudioWPatch", "mss", "numpy" , "dxcam"]

[project.scripts]
hapticstream-test = "hapticstream.demo:main"
hapticstream = "hapticstream.app:main"

[tool.setuptools.packages.find]
where = ["src"]